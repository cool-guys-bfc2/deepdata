allow_embedding: false
db_schema:
  database:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: ID
      type: string
    - admin_ui: {order: 1, width: 200}
      name: Object
      type: simpleObject
    - admin_ui: {order: 2, width: 200}
      name: Python equivalent
      type: simpleObject
    - admin_ui: {order: 3, width: 200}
      name: Names
      type: string
    - admin_ui: {order: 4, width: 200}
      name: Synonyms
      type: string
    server: full
    title: Database
  files:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: path
      type: string
    - admin_ui: {order: 1, width: 200}
      name: file
      type: media
    - admin_ui: {order: 2, width: 200}
      name: file_version
      type: string
    server: full
    title: Files
  session:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: id
      type: number
    - admin_ui: {order: 1, width: 200}
      name: key
      type: string
    - admin_ui: {order: 2, width: 200}
      name: value
      type: string
    server: full
    title: session
